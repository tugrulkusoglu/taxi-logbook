<!DOCTYPE html><html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102a43">
<title>Dagelijks Z-rapport | TAXI-CHIRON-01</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #f2f5f8;
  color: #172b3d;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  max-width: 1000px;
  margin: auto;
}

.header {
  background: #102a43;
  color: white;
  padding: 24px;
  border-radius: 14px;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

.header p {
  margin: 0;
  opacity: .85;
}

.toolbar {
  background: white;
  padding: 16px;
  border-radius: 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 12px;
  margin-bottom: 18px;
}

.toolbar label {
  font-weight: bold;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

input[type="date"] {
  padding: 11px;
  border: 1px solid #ccd5de;
  border-radius: 8px;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.primary {
  background: #102a43;
  color: white;
}

.secondary {
  background: #e5ebf0;
  color: #102a43;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 7px rgba(0,0,0,.04);
}

.card h3 {
  font-size: 13px;
  color: #66798b;
  margin: 0 0 10px;
}

.card .value {
  font-size: 24px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.card.gross {
  background: #102a43;
  color: white;
}

.card.gross h3 {
  color: #d3dfeb;
}

.section {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 18px;
}

.section h2 {
  margin-top: 0;
  font-size: 19px;
}

.category-totals {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

.category {
  padding: 15px;
  background: #f3f6f9;
  border-radius: 10px;
}

.category h3 {
  margin: 0 0 8px;
  font-size: 14px;
}

.category .amount {
  font-size: 21px;
  font-weight: bold;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th, td {
  padding: 11px 9px;
  border-bottom: 1px solid #e5eaf0;
  text-align: left;
  font-size: 14px;
}

th {
  background: #f3f6f9;
}
