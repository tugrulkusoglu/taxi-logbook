<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102a43">
<link rel="manifest" href="manifest.webmanifest">
<title>TAXI-CHIRON-01</title>
<link rel="stylesheet" href="style.css">
</head>
<body><header>
  <div class="brand">🚕 TAXI LOGBOOK</div>
  <div class="subtitle">TAXI-CHIRON-01 · Akıllı Sürüş Kaydı</div>
</header><main><!-- VARDİYA --><section class="card">
  <h2>Vardiya</h2>
  <div class="actions">
    <button id="startShift" class="primary">▶ Vardiyayı Başlat</button>
    <button id="endShift" class="secondary">■ Vardiyayı Bitir</button>
  </div>
  <div id="shiftStatus" class="status">Vardiya açık değil</div>  <!-- Z REPORT BUTONU -->  <div class="actions" style="margin-top:12px;">
    <button type="button" class="secondary"
      onclick="window.location.href='z-report.html'">
      📊 Z REPORT GÖRÜNTÜLE
    </button>
  </div>
</section><!-- YOLCULUK BAŞLAT --><section class="card">
  <h2>Yolculuk Başlat</h2>
  <p>Seçtiğin yolculuk türüne iki kez basarak yolculuğu başlat.</p>  <div class="trip-types">
    <button type="button" class="type-btn" data-kind="uber">🚗 Uber</button>
    <button type="button" class="type-btn" data-kind="bolt">🟢 Bolt</button>
    <button type="button" class="type-btn" data-kind="normal">🚕 Normal</button>
  </div>  <div id="activeTrip" class="active-trip">
    Aktif yolculuk yok
  </div>  <button id="finishTrip" class="danger" disabled>
    ■ Yolculuğu Bitir
  </button>
</section><!-- YOLCULUK ÜCRET EKRANI --><section class="card" id="fareCard" hidden>
  <h2>Yolculuk Dökümü</h2>  <div id="tripDetails"></div><label>Yolculuk Ücreti (€)
<input id="tripFare" type="number" min="0" step="0.01" placeholder="Ücreti gir">
</label>

  <button id="completeTrip" class="primary">
    ✓ Tamam · Yolculuğu Kaydet
  </button>  <button id="cancelTrip" class="secondary">
    İptal
  </button>
</section><!-- YOLCULUK GEÇMİŞİ --><section class="card">
  <h2>Yolculuk Geçmişi</h2>  <div id="summary" class="summary"></div>  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Tarih</th>
          <th>Tür</th>
          <th>Alış</th>
          <th>Varış</th>
          <th>Km</th>
          <th>Ücret</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tripRows"></tbody>
    </table>
  </div>
</section><!-- YEDEK --><section class="card">
  <h2>Yedekleme</h2>  <div class="actions">
    <button id="backup" class="secondary" type="button">
      JSON Yedeği İndir
    </button><label class="file-label">
  Yedeği Geri Yükle
  <input id="restore" type="file" accept="application/json">
</label>

  </div>
</section></main><footer>
  TAXI-CHIRON-01 · GPS Sürüş Kayıt Sistemi
</footer><script src="app.js"></script></body>
                        </html>
