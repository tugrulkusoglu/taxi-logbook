<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dienststaat - Taxi Logbook</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h1, h2 {
  margin-top: 0;
}

.date-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

button, input, select {
  padding: 10px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 7px;
  cursor: pointer;
  background: #222;
  color: white;
}

button:active {
  opacity: .8;
}

input, select {
  border: 1px solid #ccc;
  border-radius: 6px;
}

.date-controls input {
  flex: 1;
  min-width: 150px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.info-box {
  background: #f8f8f8;
  padding: 12px;
  border-radius: 8px;
}

.label {
  font-size: 12px;
  color: #666;
  margin-bottom: 5px;
}

.value {
  font-size: 18px;
  font-weight: bold;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid #eee;
  gap: 10px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 25px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.back {
  background: #555;
}

@media (max-width: 500px) {
  .info-grid {
    grid-template-columns: 1fr;
  }
}

@media print {
  body {
    background: white;
    padding: 0;
  }

  .no-print {
    display: none !important;
  }

  .card {
    box-shadow: none;
    border: 1px solid #ddd;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card no-print">
    <div class="actions">
      <button class="back" onclick="history.back()">← Terug</button>
      <button onclick="window.print()">🖨 Print / PDF</button>
    </div>
  </div>

  <div class="card">
    <h1>DIENSTAAT</h1>

    <div class="date-controls no-print">
      <button id="prevDay">◀ Vorige dag</button>
      <input type="date" id="datePicker">
      <button id="nextDay">Volgende dag ▶</button>
    </div>

    <div id="shiftSelectorBox" style="display:none; margin-top:15px;">
      <label for="shiftSelector"><b>Vardiya seç:</b></label>
      <select id="shiftSelector"></select>
    </div>

    <p id="selectedDateText"></p>
    <p id="status"></p>
  </div>

  <div class="card">
    <h2>Shift</h2>
    <div class="info-grid">
      <div class="info-box">
        <div class="label">Datum</div>
        <div class="value" id="datum">—</div>
      </div>
