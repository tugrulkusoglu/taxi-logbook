<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Dienststaat - Taxi Logbook</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #f3f4f6;
  color: #111827;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 16px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

h1 {
  margin: 0 0 16px;
  font-size: 24px;
}

h2 {
  font-size: 18px;
  margin: 0 0 14px;
}

.navigation {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  background: #111827;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button.secondary {
  background: #e5e7eb;
  color: #111827;
}

input, select {
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
}

#datePicker {
  flex: 1;
  min-width: 150px;
}

#shiftSelector {
  width: 100%;
  margin-top: 12px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat {
  padding: 15px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
}

.stat .label {
  font-size: 13px;
  color: #6b7280;
}

.stat .value {
  font-size: 23px;
  font-weight: bold;
  margin-top: 6px;
}

.trip {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
}

.trip-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.trip-type {
  font-weight: bold;
}

.trip-route {
  color: #374151;
  line-height: 1.6;
  margin-top: 8px;
  word-break: break-word;
}

.trip-details {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  margin-top: 10px;
  color: #4b5563;
  font-size: 14px;
}

.badge {
  padding: 5px 9px;
  border-radius: 20px;
  background: #e5e7eb;
  font-size: 12px;
  font-weight: bold;
}

.empty {
  padding: 20px;
  text-align: center;
  color: #6b7280;
  background: #f9fafb;
  border-radius: 10px;
}

.total {
  font-weight: bold;
  color: #059669;
}

.small {
  font-size: 13px;
  color: #6b7280;
}

hr {
  border: 0;
  border-top: 1px solid #e5e7eb;
  margin: 16px 0;
}

@media print {
  body {
    background: white;
    padding: 0;
  }

  .card {
    box-shadow: none;
    border: 1px solid #ddd;
    break-inside: avoid;
  }

  button,
  .navigation,
  #shiftSelector {
    display: none !important;
  }
}

@media (max-width: 500px) {
  .stats {
    grid-template-columns: 1fr 1fr;
  }

  body {
    padding: 10px;
  }

  .card {
    padding: 15px;
  }

  .stat .value {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>📋 Dienststaat</h1>

    <div class="navigation">
      <button class="secondary" id="prevDay">◀</button>
      <input type="date" id="datePicker">
      <button class="secondary" id="nextDay">▶</button>
      <button onclick
