<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>Diensstaat | TAXI-CHIRON-01</title>

<style>
body {
  margin: 0;
  padding: 16px;
  font-family: Arial, Helvetica, sans-serif;
  background: #f2f5f8;
  color: #172b3d;
}

.container {
  max-width: 800px;
  margin: auto;
}

.sheet {
  background: white;
  padding: 24px;
  border-radius: 12px;
}

h1 {
  text-align: center;
}

h2 {
  margin-top: 28px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.row strong {
  text-align: right;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

button, select {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}

@media print {
  body {
    background: white;
    padding: 0;
  }

  .toolbar {
    display: none;
  }

  .sheet {
    border-radius: 0;
  }
}
</style>
</head>

<body>
<div class="container">

<div class="toolbar">
  <button onclick="window.location.href='index.html'">← Terug</button>
  <select id="shiftSelect"></select>
  <button onclick="window.print()">🖨 PDF / Afdrukken</button>
</div>

<div class="sheet" id="sheet">
  <h1>Dienststaat</h1>

  <h2>Dienstgegevens</h2>
  <div class="row"><span>Datum</span><strong id="date">—</strong></div>
  <div class="row"><span>Aanvang dienst</span><strong id="start">—</strong></div>
  <div class="row"><span>Einde dienst</span><strong id="end">—</strong></div>
  <div class="row"><span>Km Stand begin</span><strong id="kmStart">0.0 km</strong></div>
  <div class="row"><span>Km Stand eind</span><strong id="kmEnd">0.0 km</strong></div>

  <h2>Dienst op de BCT</h2>
  <div class="row"><span>Rijtijd</span><strong id="driveTime">00:00</strong></div>
  <div class="row"><span>Overige</span><strong id="otherTime">00:00</strong></div>
  <div class="row"><span>Pauze</span><strong id="pauseTime">00:00</strong></div>
  <div class="row"><span>Totaal</span><strong id="totalTime">00:00</strong></div>

  <h2>Ritgegevens</h2>
  <div class="row"><span>Aantal ritten</span><strong id="tripCount">0</strong></div>
  <div class="row"><span>Totale afstand</span><strong id="totalDistance">0.0 km</strong></div>
  <div class="row"><span>Afstand beladen</span><strong id="loadedDistance">0.0 km</strong></div>
  <div class="row"><span>Afstand onbeladen</span><strong id="unloadedDistance">0.0 km</strong></div>
  <div class="row"><span>Aantal activiteiten</span><strong id="activities">0</strong></div>
</div>
</div>

<script>
"use strict";

const SHIFT_KEY = "taxi_shift";
const TRIPS_KEY = "taxi_trips";

function readJSON(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
  } catch {
    return fallback;
  }
}

function getShifts() {
  const current = readJSON(SHIFT_KEY, null);
  const archived = readJSON("taxi_shifts_history", []);

  const list = Array.isArray(archived) ? archived.slice() : [];

  if (current && current.startTime) {
    list.push(current);
  }

  return list.sort((a, b) => new Date(b.startTime) - new Date(a.startTime);
}

function timeText(date) {
  if (!date) return "—";
  return new Date(date).toLocaleTimeString("nl-BE", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function duration(ms) {
  ms = Math.max(0, ms || 0);
  const minutes = Math.floor(ms / 60000);
  const hours = Math.floor(minutes / 60);
  return String(hours).padStart(2, "0") + ":" +
    String(minutes % 60).padStart(2, "0");
}

function shiftDuration(shift) {
  if (!shift.startTime) return 0;
  const end = shift.endTime || Date.now();
  return Math.max(0, new Date(end) - new Date(shift.startTime));
}

function pauseDuration(shift) {
  return (shift.pauses || []).reduce((sum, p) => {
    const end = p.endTime || (shift.active ? Date.now() : 0);
    return sum + Math.max(0, new Date(end) - new Date(p.startTime));
  }, 0);
}

function driveDuration(trips) {
  return trips.reduce((sum, t) => {
    if (!t.startTime || !t.endTime) return sum;
    return sum + Math.max(0, new Date(t.endTime) - new Date(t.startTime));
  }, 0);
}

function set(id, value) {
  document.getElementById(id).textContent = value;
}

function localDate(date) {
  return new Date(date).toLocaleDateString("nl-BE");
}

function getShiftTrips(shift) {
  const all = readJSON(TRIPS_KEY, []);
  return all.filter(t =>
    new Date(t.startTime) >= new Date(shift.startTime) &&
    (!shift.endTime || new Date(t.startTime) <= new Date(shift.endTime))
  );
}

function render(shift) {
  if (!shift) return;

  const trips = getShiftTrips(shift);
  const totalMs = shiftDuration(shift);
  const pauseMs = pauseDuration(shift);
  const driveMs = driveDuration(trips);
  const otherMs = Math.max(0, totalMs - pauseMs - driveMs);

  const loadedKm = trips.reduce((sum, t) => sum + Number(t.distanceKm || 0), 0);
  const totalKm = loadedKm;
  const unloadedKm = 0;

  set("date", localDate(shift.startTime));
  set("start", timeText(shift.startTime));
  set("end", timeText(shift.endTime));
  set("kmStart", "0.0 km");
  set("kmEnd", totalKm.toFixed(1) + " km");

  set("driveTime", duration(driveMs));
  set("otherTime", duration(otherMs));
  set("pauseTime", duration(pauseMs));
  set("totalTime", duration(totalMs));

  set("tripCount", trips.length);
  set("totalDistance", totalKm.toFixed(1) + " km");
  set("loadedDistance", loadedKm.toFixed(1) + " km");
  set("unloadedDistance", unloadedKm.toFixed(1) + " km");
  set("activities", trips.length);
}

const shifts = getShifts();
const select = document.getElementById("shiftSelect");

shifts.forEach((shift, index) => {
  const option = document.createElement("option");
  option.value = index;
  option.textContent =
    localDate(shift.startTime) + " · " + timeText(shift.startTime);
  select.appendChild(option);
});

select.addEventListener("change", () => {
  render(shifts[Number(select.value)]);
});

if (shifts.length) {
  render(shifts[0]);
} else {
  document.getElementById("sheet").innerHTML =
    "<h1>Dienststaat</h1><p>Nog geen diensten geregistreerd.</p>";
}
</script>
</body>
</html>
